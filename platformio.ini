[platformio]
default_envs = node08

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=32768
    -D__EMBEDDED__
lib_deps =
    jgromes/RadioLib@^7.1.0
    mathieucarbou/AsyncTCP
    mathieucarbou/ESPAsyncWebServer

lib_compat_mode = off
[env:node08]
build_flags =
    ${env.build_flags}
    -DNODE_ID=8

[env:node09]
build_flags =
    ${env.build_flags}
    -DNODE_ID=9
